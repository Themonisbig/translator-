name: CPU checks and container
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/personaplex/client/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/check.sh
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_check.py
  container:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/themonisbig/personaplex-voice:main,ghcr.io/themonisbig/personaplex-voice:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Themonisbig/translator-
          cache-from: type=gha
          cache-to: type=gha,mode=max
