name: CPU checks and container
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/fish-speech/awesome_webui/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/check.sh
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_gateway_check.py
      - run: TEST_PUBLIC=1 python tests/browser_gateway_check.py
  container:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free hosted runner disk for CUDA dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish image
        env:
          PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' }}
          IMAGE_SHA: ${{ github.sha }}
        run: bash scripts/build_image.sh
